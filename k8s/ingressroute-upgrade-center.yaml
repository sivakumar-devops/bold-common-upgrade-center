apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bold-upgrade-center-trailing-slash
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/upgrade-center)$
    replacement: ${1}/
    permanent: true
---
# Add this route to the existing common IngressRoute before the catch-all PathPrefix(`/`) route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik
  name: bold-upgrade-center-route-template
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`bold-common-upgrade-center.boldbidemo.com`) && PathPrefix(`/upgrade-center`)
      middlewares:
        - name: body-limit-200m
        - name: bold-upgrade-center-trailing-slash
      priority: 1000
      services:
        - name: bold-upgrade-center
          port: 80
          serversTransport: long-timeouts-transport
          sticky:
            cookie:
              maxAge: 600
              name: bold.k8s.pod.id
  tls:
    secretName: bold-tls
